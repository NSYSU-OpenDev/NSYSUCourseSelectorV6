name: 🐛 回報 Bug
description: 回報選課輔助系統的錯誤或異常行為
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感謝你花時間回報問題！請盡量填寫下列欄位，能大幅加快我們定位問題的速度。

  - type: textarea
    id: description
    attributes:
      label: 問題描述
      description: 簡述發生了什麼事
      placeholder: 例：點擊課表時間段後，課程列表沒有被篩選
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 重現步驟
      description: 請一步一步描述如何重現這個問題
      placeholder: |
        1. 進入「全部課程」分頁
        2. 在課表上點擊「週一 3-4 節」
        3. 觀察課程列表
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 預期行為
      placeholder: 例：課程列表應只顯示週一 3-4 節的課程
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 實際行為
      placeholder: 例：課程列表沒有變化，仍顯示全部課程
    validations:
      required: true

  - type: input
    id: semester
    attributes:
      label: 學期
      description: 發生問題時所選的學期
      placeholder: 例：114 學年度第 1 學期

  - type: dropdown
    id: device
    attributes:
      label: 裝置類型
      options:
        - 桌機／筆電
        - 手機
        - 平板
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: 瀏覽器與版本
      placeholder: 例：Chrome 131、Safari 18
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截圖或錯誤訊息
      description: 如有畫面截圖或瀏覽器主控台（F12 Console）的錯誤訊息，請一併附上

  - type: checkboxes
    id: checks
    attributes:
      label: 確認事項
      options:
        - label: 我已搜尋過現有的 Issue，確認這不是重複回報
          required: true
        - label: 我已嘗試過重新整理頁面，問題仍然存在
