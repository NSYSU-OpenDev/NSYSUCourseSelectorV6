name: ✨ 功能建議
description: 提出新功能或改善現有功能的想法
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        歡迎提出想法！請說明你想解決的問題，而不只是想要的實作方式，這樣我們比較容易找到最合適的作法。

  - type: textarea
    id: problem
    attributes:
      label: 想解決的問題
      description: 目前選課流程中，哪個環節讓你覺得不方便？
      placeholder: 例：想比較兩個時段的課程時，必須反覆切換篩選條件
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的功能
      description: 你希望系統怎麼做？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 其他替代方案
      description: 你是否考慮過其他作法？目前是怎麼繞過這個問題的？

  - type: dropdown
    id: scope
    attributes:
      label: 功能範圍
      options:
        - 課程搜尋／篩選
        - 課表顯示
        - 選課管理與匯出
        - 介面與操作體驗
        - 行動裝置支援
        - 國際化／翻譯
        - 其他
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 補充說明
      description: 參考畫面、其他系統的作法、草圖等

  - type: checkboxes
    id: checks
    attributes:
      label: 確認事項
      options:
        - label: 我已搜尋過現有的 Issue，確認這不是重複建議
          required: true
        - label: 我願意協助實作這項功能（非必要）
